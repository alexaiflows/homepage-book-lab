# .github/workflows/publish.yml — 사이트를 만들어 Pages에 게시한다(8장: 공개 주소를 넘겨 저장해 둔 판을 읽게 함)
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - id: pages
        uses: actions/configure-pages@v6
      - run: python main.py
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
